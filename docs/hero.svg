<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#123a2f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#bar)"/>
  <text x="64" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#7dd3fc" letter-spacing="4">MAKEFUN-SITE, REBUILT FOR SPEED</text>
  <text x="64" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">Byte-exact output.</text>
  <text x="64" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#34d399">A third of the CPU.</text>
  <text x="64" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">A dependency-free drop-in for makefun-site 1.0.0: same front matter, same templates,</text>
  <text x="64" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">same Markdown, same slugs, same report — produced by single-pass scanners.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="64" y="384" width="300" height="58" rx="10" fill="#164e63"/>
    <text x="84" y="421" font-size="24" fill="#e0f2fe">2.79× practice set</text>
    <rect x="384" y="384" width="330" height="58" rx="10" fill="#065f46"/>
    <text x="404" y="421" font-size="24" fill="#d1fae5">3.43× fresh 12-case set</text>
    <rect x="734" y="384" width="300" height="58" rx="10" fill="#1e3a5f"/>
    <text x="754" y="421" font-size="24" fill="#dbeafe">15 / 15 cases exact</text>
  </g>
</svg>
